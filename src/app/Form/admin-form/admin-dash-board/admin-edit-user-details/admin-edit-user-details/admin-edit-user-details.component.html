<ngx-spinner bdColor = "rgba(0, 0, 0, 0.8)" size = "medium" color = "#fff" type = "ball-zig-zag" [fullScreen] = "true"><p style="color: white" > Loading... </p></ngx-spinner>

<div class="edit_user">
  <form [formGroup]="userEditForm" (ngSubmit)="onSubmit()">
    <div class="row jumbotron box8">
      <div class="col-sm-12 mx-t3 mb-4">
        <h2 class="text-center text-info">Edit Register User</h2>
      </div>
      <div class="col-sm-6 form-group">
        <label for="firstName">First Name</label>
        <input type="text" class="form-control" [class.is-invalid]="isInvalidAndTouched('firstName')"
          formControlName="firstName" name="firstName" id="firstName" placeholder="Enter your first name" required />
      </div>
      <div class="col-sm-6 form-group">
        <label for="lastName">Last name</label>
        <input type="text" class="form-control" formControlName="lastName" name="lastName" id="lastName"
          placeholder="Enter your last name"  />
      </div>
      <div class="col-sm-6 form-group">
        <label for="employeeId">Employee Id</label>
        <input type="text" class="form-control" [class.is-invalid]="isInvalidAndTouched('employeeId')"
          formControlName="employeeId" name="employeeId" id="employeeId" placeholder="Enter your employee Id"
          required />
      </div>
      <div class="col-sm-6 form-group">
        <label for="password">Password</label>
        <input type="text" name="password" [class.is-invalid]="isInvalidAndTouched('password')"
          formControlName="password" class="form-control" id="password" placeholder="Enter your password" required />
      </div>
      <div class="col-sm-6 form-group">
        <label for="dateOfBirth">Date Of Birth</label>
        <input type="Date" formControlName="dateOfBirth" name="dateOfBirth" class="form-control" id="dateOfBirth"
          placeholder="Enter date of Birth" required/>
      </div>
      <div class="col-sm-6 form-group">
        <label for="profile">Image Upload</label>
        <input type="file" formControlName="profile" name="profile" class="form-control" id="profile"
          (change)="onFileSelected($event)"  />
      </div>
      <div class="col-sm-6 form-group">
        <label for="department">Department</label>
        <input type="text" formControlName="department" name="department" class="form-control" id="department"
          placeholder="Enter your job department"  />
      </div>
      <div class="col-sm-6 form-group">
        <label for="dateOfHire">Date Of Hire</label>
        <input type="Date" formControlName="dateOfHire" name="dateOfHire" class="form-control" id="dateOfHire"
          placeholder="Enter date of hire" required />
      </div>
      <div class="col-sm-6 form-group">
        <label for="employeeStatus">Employee Status</label>
        <select formControlName="employeeStatus" [class.is-invalid]="isInvalidAndTouched('employeeStatus')"
          id="employeeStatus" class="form-control browser-default custom-select" required>
          <option value="">Select</option>
          <option value="Active">Active</option>
          <option value="In-Active">In-Active</option>
        </select>
      </div>
      <div class="col-sm-6 form-group">
        <label for="employeeType">Employee Tpye</label>
        <select formControlName="employeeType" [class.is-invalid]="isInvalidAndTouched('employeeType')"
          id="employeeType" class="form-control browser-default custom-select" required>
          <option value="">Select</option>
          <option value="Full-Time">Full-Time</option>
          <option value="Part-Time">Part-Time</option>
          <option value="Contractual">Contractual</option>
        </select>
      </div>
      <div class="col-sm-6 form-group">
        <label for="title">Title</label>
        <input type="text" formControlName="title" name="title" class="form-control" id="title"
          placeholder="Enter your job title"  />
      </div>
      <div class="col-sm-6 form-group">
        <label for="sourceOfHire">Source Of Hire</label>
        <select formControlName="sourceOfHire" [class.is-invalid]="isInvalidAndTouched('sourceOfHire')"
          id="sourceOfHire" class="form-control browser-default custom-select" required>
          <option value="">Select</option>
          <option value="Direct">Direct</option>
          <option value="In-direct">In-Direct</option>
        </select>
      </div>
      <div class="col-sm-6 form-group">
        <label for="workPhone">Work Phone Number</label>
        <input type="tel" formControlName="workPhone" name="workPhone" class="form-control" id="workPhone"
          placeholder="Enter your work phone number"  />
      </div>
      <div class="col-sm-6 form-group">
        <label for="salary">Salary</label>
        <input type="text" formControlName="salary" name="salary" class="form-control" id="salary"
          placeholder="Enter your Salary" />
      </div>
      <div class="col-sm-6 form-group">
        <label for="payType">Pay Type</label>
        <select formControlName="payType" [class.is-invalid]="isInvalidAndTouched('payType')"
          id="payType" class="form-control browser-default custom-select" required>
          <option value="">Select</option>
          <option value="Hourly">Hourly</option>
          <option value="Daily">Daily</option>
          <option value="Weekly">Weekly</option>
          <option value="Bi-Weekly">Bi-Weekly</option>
          <option value="Monthly">Monthly</option>
          <option value="Contract">Contract</option>
        </select>

      <div class="col-sm-6 form-group">
